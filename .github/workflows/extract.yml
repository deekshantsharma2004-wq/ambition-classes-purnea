name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract ambition-nextjs-v2.zip into repo root
        run: |
          set -euo pipefail
          test -f ambition-nextjs-v2.zip
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -q ambition-nextjs-v2.zip -d /tmp/extracted
          find /tmp/extracted -maxdepth 2 -type d -name '__MACOSX' -prune -exec rm -rf {} +
          SRC=/tmp/extracted
          if [ "$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            SRC="$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d)"
          fi
          echo "Extracted root: $SRC"
          find "$SRC" -maxdepth 2 -type f | sort
          test -f "$SRC/package.json"
          test -f "$SRC/next.config.ts"
          test -f "$SRC/tsconfig.json"
          test -d "$SRC/src"
          test -d "$SRC/public"
          test -f "$SRC/public/images/og.png"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'ambition-nextjs-v2.zip' -exec rm -rf {} +
          rsync -a --exclude='.github' "$SRC"/ ./
          rm -f ambition-nextjs-v2.zip
          rm -rf .github
          git status --short
          ls -la
      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract ambition-nextjs-v2.zip into repo root"
          git push
